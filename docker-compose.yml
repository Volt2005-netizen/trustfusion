services:
  trustfusion:
    build:
      context: .
      dockerfile: Dockerfile
    image: trustfusion:latest
    container_name: trustfusion-serving
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
